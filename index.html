<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/index.css">
    <script src="/calculator.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Quicksand:wght@700&display=swap"
      rel="stylesheet">
    <title>Calculator</title>
  </head>
  <body>

    <div class="main-container">

      <div class="header">
        <h1>Square Calculator</h1>
        <p id="visualization"></p>
        <p id="result"></p>
      </div>

      <div>
        <hr>
      </div>

      <div class="user-calculator">
        <div class="content" data-value="C">C</div>
        <div class="content" data-value="AC">AC</div>
        <div class="content" data-value="%">%</div>
        <div class="content" data-value="/">/</div>
        <div class="content" data-value="7">7</div>
        <div class="content" data-value="8">8</div>
        <div class="content" data-value="9">9</div>
        <div class="content" data-value="*" id="mutiplication">X</div>
        <div class="content" data-value="4">4</div>
        <div class="content" data-value="5">5</div>
        <div class="content" data-value="6">6</div>
        <div class="content" data-value="-" id="sustraction">-</div>
        <div class="content" data-value="1">1</div>
        <div class="content" data-value="2">2</div>
        <div class="content" data-value="3">3</div>
        <div class="content" data-value="+" id="sum">+</div>
        <div class="content" data-value="0">0</div>
        <div class="content" data-value=".">.</div>
        <div class="content" data-value="00">00</div>
        <div class="content" id="total" data-value="=">=</div>
      </div>

    </div>

  </body>
</html>
